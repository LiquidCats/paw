name: Go CI

on:
  pull_request:

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

  test:
    name: Test ${{ matrix.module }}
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: |
            **/go.mod
            **/go.sum
            go.work.sum

      - name: Verify Go workspace
        run: |
          test "$(go env GOWORK)" = "${GITHUB_WORKSPACE}/go.work"

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

  lint:
    name: Lint ${{ matrix.module }}
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run golangci-lint
        run: |
          docker run --rm \
            -e GOWORK=/src/go.work \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w "/src/${{ matrix.module }}" \
            "golangci/golangci-lint:v2.11.4-alpine" \
            golangci-lint run ./... --configs=${GITHUB_WORKSPACE}/.golangci.yaml
