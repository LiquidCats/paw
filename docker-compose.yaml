x-common-env: &common-env
  GOMAXPROCS: 1
  GOMEMLIMIT: 64MiB
x-rater-env: &rater-env
  <<: *common-env
  LOGGING_LEVEL: debug

  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_USER: rater_db_user
  DATABASE_PASSWORD: rater_db_secret
  DATABASE_DATABASE: rater_db

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0

services:
  rater:
    build:
      dockerfile: ./build/docker/Dockerfile.dev
      context: .
      args:
        MODULE_NAME: "rater"
    environment:
      <<: *rater-env
    volumes:
      - .:/app
      - godeps:/go
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: rootsecret
      # one "database:user:password" per service, created by scripts/dev/postgres
      SERVICE_DATABASES: "rater_db:rater_db_user:rater_db_secret"
    volumes:
      # postgres 18+ keeps PGDATA in a versioned subdirectory of this path
      - postgres_data:/var/lib/postgresql
      - ./scripts/dev/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      # -h forces TCP: the temporary init-time server only listens on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  godeps:
