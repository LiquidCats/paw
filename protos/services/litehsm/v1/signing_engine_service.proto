syntax = "proto3";

package services.litehsm.v1;

option go_package = "github.com/LiquidCats/paw/protos/gen/go/services/litehsm/v1";

import "services/litehsm/v1/common.proto";

service SigningEngineService {
  rpc SignEVM(SignEVMRequest) returns (SignEVMResponse);
  rpc SignUTXO(SignUTXORequest) returns (SignUTXOResponse);
}

message SignEVMRequest {
  SenderInfo sender = 1;
  string gas_price = 2;
  string gas = 3;
  string to = 4;
  string value = 5;
  string data = 6;
}

message SignEVMResponse {
  string txid = 1;
  string signed_blob = 2;
}

message SignUTXORequest {
  message Input {
    string txid = 1;
    string vout = 2;
    SenderInfo sender = 3;
  }
  message Output {
    string address = 1;
    string amount = 2;
  }

  repeated Input inputs = 1;
  repeated Output outputs = 2;
}

message SignUTXOResponse {
  string txid = 1;
  string signed_blob = 2;
}